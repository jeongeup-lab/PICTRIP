<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PICTRIP Admin · 게시물 관리</title>
<link rel="stylesheet" href="/admin/assets/admin.css" />
<link rel="stylesheet" href="/admin/assets/overseas.css" />
</head>
<body>
<div class="shell">

  <aside class="sidebar">
    <div class="sb-brand">
      <div class="logo"><img src="/admin/assets/logo.png" alt="PICTRIP" /></div>
      <div class="name">PICTRIP</div>
    </div>
    <div class="sb-group">운영</div>
    <a class="nav-item" href="/admin">
      <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      개요
    </a>
    <a class="nav-item" href="/admin/history">
      <svg class="ico" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="3.5" cy="6" r="1.2"/><circle cx="3.5" cy="12" r="1.2"/><circle cx="3.5" cy="18" r="1.2"/></svg>
      수집 이력
      <span class="badge" id="sb-history-badge" style="display:none"></span>
    </a>
    <a class="nav-item" href="/admin/health">
      <svg class="ico" viewBox="0 0 24 24"><path d="M3 12h4l2 7 4-14 2 7h6"/></svg>
      서비스 헬스
    </a>
    <div class="sb-group">콘텐츠</div>
    <a class="nav-item active" href="/admin/overseas">
      <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><circle cx="8.5" cy="10.5" r="1.6"/><path d="m21 16-5-5L5 20"/></svg>
      게시물
    </a>
    <div class="sb-foot"><span class="dot live"></span> api.pictrip.org · live
      <form method="post" action="/admin/logout"><button class="sb-logout" type="submit">로그아웃</button></form>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="crumb"><span>콘텐츠</span> <span class="sep">/</span> <b>게시물</b></div>
      <div class="spacer"></div>
      <div class="env-pill"><span class="dot ok"></span> overseas_spots</div>
      <div class="clock" id="clock">--:--:--</div>
    </div>

    <div class="content">
      <div class="page-head">
        <h1>게시물 관리</h1>
        <p>해외 스팟 게시물입니다. 숨김 처리하면 앱 피드(/v1/feed)에서 즉시 제외됩니다.</p>
      </div>

      <div class="ov-searchbar">
        <div class="ov-search">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input id="ov-search" placeholder="게시물 이름으로 검색" aria-label="게시물 검색" autocomplete="off">
          <span class="n" id="ov-count"></span>
        </div>
      </div>

      <div id="ov-loading" class="card" style="padding:32px;text-align:center">
        <span style="color:var(--ink-3);font-size:13px">불러오는 중…</span>
      </div>

      <div id="ov-error" style="display:none;background:var(--bad-soft);border:1px solid #f0b9bd;border-radius:14px;padding:24px 28px">
        <p style="margin:0 0 12px;color:var(--bad);font-weight:600">데이터를 불러오지 못했습니다.</p>
        <p id="ov-error-msg" style="margin:0 0 16px;font-size:13px;color:var(--ink-2)"></p>
        <button class="btn ghost sm" id="ov-retry" type="button">다시 시도</button>
      </div>

      <div id="ov-data" style="display:none">
        <div class="card">
          <div class="card-h"><h2>해외 스팟</h2><span class="sub" id="ov-caption"></span></div>
          <div class="card-b" style="padding:8px 12px 12px">
            <table>
              <thead>
                <tr>
                  <th class="ov-th-thumb"></th>
                  <th>이름</th>
                  <th>나라</th>
                  <th class="num">유명도</th>
                  <th>상태</th>
                  <th class="ov-th-act"></th>
                </tr>
              </thead>
              <tbody id="ov-rows"></tbody>
            </table>
          </div>
        </div>

        <div class="ov-empty" id="ov-empty" hidden>
          <span class="ic"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/><path d="M8.5 11h5"/></svg></span>
          <b>게시물이 없습니다</b>
          <p>다른 검색어를 시도해 보세요</p>
        </div>

        <div class="ov-more" id="ov-more" hidden>
          <button class="btn ghost" id="ov-more-btn" type="button">더 보기</button>
        </div>
      </div>

    </div>
  </div>
</div>

<template id="tpl-overseas-row">
  <tr>
    <td class="ov-thumb"><span class="ovim"><img src="" alt="" hidden><span class="phx" hidden><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5L5 20"/></svg></span></span></td>
    <td class="ov-name"><span class="strong" data-name></span></td>
    <td data-country></td>
    <td class="num" data-fame></td>
    <td><span class="chip" data-status></span></td>
    <td class="ov-act"><button class="btn ghost sm" type="button" data-toggle></button></td>
  </tr>
</template>

<script src="/admin/assets/admin.js"></script>
<script src="/admin/assets/overseas.js"></script>
</body>
</html>
