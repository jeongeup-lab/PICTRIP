name: discord
description: >-
  DAG 실행 결과를 Discord 웹훅에 표로 보낸다. Kuma 를 대체하지 않는다 —
  Kuma 는 "아예 안 돌았나"(push 타임아웃)를, 이쪽은 "무슨 일이 있었나"를 맡는다.
  잡이 안 돌면 이 액션도 안 도니 미실행 감시는 Kuma 만 할 수 있다.
  웹훅 시크릿이 없으면 조용히 건너뛴다 — heartbeat 액션과 같은 계약.

inputs:
  url:
    description: "Discord 웹훅 URL (secrets.DISCORD_WEBHOOK_URL)"
    required: false
    default: ""
  dag:
    description: "메시지 제목에 쓸 DAG 이름 (예: pipeline-daily)"
    required: true
  workflow-file:
    description: "직전 실행 조회용 워크플로 파일명 — 복구 알림 판정에 쓴다"
    required: true
  always:
    description: >-
      true 면 성공해도 보낸다. 일일은 false 로 둔다 — 매일 초록 카드를 쏘면
      1년에 365개고, 그걸 무시하는 습관이 붙으면 진짜 실패도 놓친다.
      "안 돌았음"은 Kuma 가 이미 잡는다.
    required: false
    default: "false"
  self-job:
    description: "표에서 뺄 자기 잡 이름 — 호출 시점에 아직 in_progress 다"
    required: false
    default: "heartbeat"
  token:
    description: "Actions API 조회용 — 잡별 결과·소요시간은 needs 로는 못 얻는다"
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        DISCORD_URL: ${{ inputs.url }}
        DAG: ${{ inputs.dag }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        ALWAYS: ${{ inputs.always }}
        SELF_JOB: ${{ inputs.self-job }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: python3 "${{ github.action_path }}/notify.py"
