name: codeql
# Post-merge only, on purpose: CodeQL is not a required check, so running it on
# every PR added ~2min × 2 languages without blocking anything. Alerts on main
# (+ the weekly sweep) still surface the same findings.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
