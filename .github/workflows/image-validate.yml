name: image-validate
# spots.first_image_url 생존 검증 — tong.visitkorea.or.kr 에서 삭제된 KTO 원본
# (구형 이미지 ~20%가 404)을 _image2_1 중형으로 교체하거나 NULL 처리한다.
# RemoteImage 의 클라이언트측 404 강등을 데이터 레이어로 옮기는 주간 스윕.
#
# URL 이 바뀐 행은 0019 트리거가 spot_embeddings 를 지우고 embedding_failures 에
# source_changed 로 큐잉한다 → rewritten>0 이면 backend-backfill-embeddings 를
# write=true 로 디스패치해야 해당 스팟이 매칭에 복귀한다.
#
# schedule 은 default 브랜치 기준으로 동작하므로 dev 머지 후부터 유효.
on:
  schedule:
    - cron: "0 20 * * 6" # 일요일 05:00 KST (토 20:00 UTC + 9h) — 04:00 daily sync 뒤
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probe only — report counts without writing"
        type: boolean
        default: false
      limit:
        description: "Cap probed rows (smoke test)"
        type: string
        default: ""

# 최소 권한: CLI 만 실행, git/API 쓰기 없음.
permissions: {}

# 주간 실행·수동 실행이 겹치지 않게 가드.
concurrency:
  group: image-validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: [self-hosted, ct111]
    timeout-minutes: 60
    steps:
      # pipeline-deploy 가 rsync 로 유지하는 배포 경로에서 실행. .env(DATABASE_URL)
      # 와 .venv 는 배포마다 보존되므로 config 가 자동 로드된다.
      - name: Run validate-images
        run: |
          set -euo pipefail
          cd /opt/pictrip-pipeline/pipeline
          args=()
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          if [ -n "${LIMIT}" ]; then args+=(--limit "${LIMIT}"); fi
          /usr/local/bin/uv run pictrip-data validate-images ${args[@]+"${args[@]}"}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
