name: backend-recover
# api 컨테이너가 내려갔을 때 compose 로 되살린다.
#
# docker restart 는 compose 가 관리하는 컨테이너를 되살리지 못하는 경우가 있다
# (헬스체크 실패로 멈추거나, 재기동 중 죽으면 그대로 남는다). compose up 이
# .deploy.env 의 이미지 태그로 다시 세우는 것이 정본 복구 경로다.
on:
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: "진단만 — 되살리지 않는다"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: api-recover
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, ct112]
    env:
      DIAGNOSE_ONLY: ${{ inputs.diagnose_only }}
    steps:
      - run: |
          set +e
          echo "=== 컨테이너 (죽은 것 포함) ==="
          docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Image}}' | head -10
          cid="$(docker ps -aq --filter 'name=api' | head -n1)"
          if [ -n "$cid" ]; then
            echo "=== 마지막 로그 40줄 ==="
            docker logs --tail 40 "$cid" 2>&1 | tail -40
          else
            echo "(api 컨테이너가 아예 없다)"
          fi
          exit 0

      - if: ${{ inputs.diagnose_only != true }}
        run: |
          set -euo pipefail
          envfile=/opt/pictrip-api/.env
          if [ -f "$envfile" ]; then
            echo "=== .env 권한 ==="; ls -l "$envfile"
            chmod 644 "$envfile"
            echo "고친 뒤:"; ls -l "$envfile"
          fi
          cd /opt/pictrip-api
          docker compose --env-file .deploy.env up -d
          for _ in $(seq 1 45); do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "api healthy"
              curl -fsS --max-time 5 http://127.0.0.1:8000/health
              exit 0
            fi
            sleep 2
          done
          echo "=== 90초 안에 안 떴다. 로그 ==="
          docker logs --tail 60 "$(docker ps -aq --filter 'name=api' | head -n1)" 2>&1 | tail -60
          exit 1
