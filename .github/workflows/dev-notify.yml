name: dev-notify
# Announce every merge to dev in Discord so the team knows something shipped
# and can go verify it (api.pictrip.org / TestFlight OTA). The webhook URL is
# a credential (anyone holding it can post) — keep it in the DISCORD_WEBHOOK_URL
# secret, never inline.
on:
  push:
    branches: [dev]
concurrency:
  group: dev-notify
  cancel-in-progress: false
jobs:
  discord:
    runs-on: ubuntu-latest
    # head_commit is null on branch-create pushes — nothing to announce.
    if: ${{ github.event.head_commit }}
    steps:
      - name: Post merge to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          set -euo pipefail
          title="${COMMIT_MSG%%$'\n'*}"
          payload=$(jq -n --arg t "$title" --arg a "$AUTHOR" --arg u "$COMMIT_URL" \
            '{content: ("📦 **dev 머지** — " + $t + "\nby " + $a + " · <" + $u + ">\n배포 자동 진행 (backend → api.pictrip.org · mobile → OTA · pipeline → CT111, 해당 경로 변경 시)")}')
          curl -sfS -H "Content-Type: application/json" -d "$payload" "$WEBHOOK_URL"
