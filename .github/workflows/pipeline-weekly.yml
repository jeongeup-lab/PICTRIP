name: pipeline-weekly
# 주간 정합성 DAG — 일일 증분이 못 보는 것들을 잡는다.
#
#   sync-full ─┬─ image-validate ─ embed-repair ─ gallery-repair ─┐
#              └─ signals ──────────────────────────────────────────┴─ heartbeat
#
# sync-full 은 soft-delete 의 2차 백스톱이지 유일한 경로가 아니다. showflag 를
# 안 보내면 areaBasedSyncList2 는 표출·비표출을 둘 다 준다(공식 매뉴얼상 showflag
# 는 선택 필터다). 실측으로도 일일 증분에 show_flag=0 이 매일 섞여 들어온다
# (2026-08-10 23건 · 08-12 28건 · 08-14 22건). sync-full 이 잡는 것은 modifiedtime
# 갱신 없이 목록에서 통째로 사라진 스팟뿐이다.
#
# image-validate 가 죽은 원본을 교체하면 0020 트리거가 spot_embeddings /
# spot_embeddings_gallery 행을 지우고 embedding_failures 에 source_changed 로
# 큐잉한다. 그래서 repair 두 잡이 needs 로 붙는다 — 예전에는 이 후속을 사람이
# dispatch 해야 했다.
#
# schedule 은 default 브랜치(dev) 기준으로만 동작한다.
on:
  schedule:
    - cron: "23 19 * * 6" # 일요일 04:23 KST (토 19:23 UTC + 9h)
  workflow_dispatch:
    inputs:
      skip_full:
        description: "sync-full 건너뛰기 (KTO 쿼터 절약)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pipeline-weekly
  cancel-in-progress: false

jobs:
  # 전량 재조정 + soft-delete. 응답에서 사라진 스팟이 현재 노출분의 절반 미만이면
  # PartialFullSync 로 중단한다(부분 응답이 전체를 숨기는 사고 방지).
  sync-full:
    if: ${{ !inputs.skip_full }}
    runs-on: [self-hosted, ct111]
    timeout-minutes: 120
    steps:
      - run: |
          set -euo pipefail
          cd /opt/pictrip-pipeline/pipeline
          /usr/local/bin/uv run pictrip-data sync-full

  # NOTE: CT111 발 프로브는 tong.visitkorea.or.kr 엣지 차이로 삭제 이미지도 200 을
  # 받는다(2026-07-16 실측, 4.3만 장 전수에서 사망 0건). 사용자 시점 판정이 아니다.
  # 판정을 고치려면 프로브를 img.pictrip.org 경유로 바꿔야 한다 — 별건.
  # cancelled 도 막는다: 잡 타임아웃은 failure 가 아니라 cancelled 로 찍힌다
  # (2026-08-18 월간 ETL 이 timeout-minutes: 120 에 걸려 cancelled 였다). 반쯤
  # 끊긴 전량 동기화 뒤에 6.8만 장 프로브를 그대로 돌릴 이유가 없다.
  image-validate:
    needs: sync-full
    if: always() && needs.sync-full.result != 'failure' && needs.sync-full.result != 'cancelled'
    runs-on: [self-hosted, ct111]
    timeout-minutes: 60
    steps:
      - run: |
          set -euo pipefail
          cd /opt/pictrip-pipeline/pipeline
          /usr/local/bin/uv run pictrip-data validate-images

  embed-repair:
    needs: image-validate
    runs-on: [self-hosted, ct112]
    timeout-minutes: 180
    # 임베딩 잡은 admin:embed:running Redis 락을 공유한다 — 겹치면 뒤에 온 잡이
    # RuntimeError 로 죽으므로 워크플로를 가로질러 직렬화한다.
    concurrency:
      group: embedding-job
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/api-exec
        with:
          module: scripts.backfill_embeddings
          args: --only-failed --failure-reason source_changed

  # 갤러리 centroid 는 2026-08-09 에 완주했지만 죽은 잡이 아니다 — image-validate 가
  # URL 을 고치면 트리거가 행을 지우므로 다시 채워야 한다. 일일 슬롯에서 빼고
  # 원인(image-validate) 뒤로 옮겼다.
  gallery-repair:
    # embed-repair 뒤에 줄 세운다. 둘 다 image-validate 만 보고 동시에 pending 이 되면
    # 같은 concurrency group 에서 나중에 들어온 쪽이 앞선 pending 을 취소한다.
    needs: embed-repair
    runs-on: [self-hosted, ct112]
    timeout-minutes: 60
    # 임베딩 잡은 admin:embed:running Redis 락을 공유한다 — 겹치면 뒤에 온 잡이
    # RuntimeError 로 죽으므로 워크플로를 가로질러 직렬화한다.
    concurrency:
      group: embedding-job
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/api-exec
        with:
          module: scripts.backfill_gallery_embeddings
          args: --limit 800

  # 홈 채널 신호. buzz=네이버 블로그, visual=CLIP 텍스트 앵커(외부 콜 0).
  signals:
    needs: sync-full
    if: always() && needs.sync-full.result != 'failure'
    runs-on: [self-hosted, ct112]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/api-exec
        with:
          module: scripts.sync_buzz
      - uses: ./.github/actions/api-exec
        with:
          module: scripts.compute_visual

  heartbeat:
    permissions:
      actions: read
    needs: [embed-repair, gallery-repair, signals]
    if: always()
    runs-on: [self-hosted, ct111]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/heartbeat
        with:
          url: ${{ secrets.KUMA_PUSH_PIPELINE_WEEKLY }}
          status: ${{ (needs['embed-repair'].result == 'success' && needs['gallery-repair'].result == 'success' && needs.signals.result == 'success') && 'up' || 'down' }}
          msg: "weekly embed=${{ needs['embed-repair'].result }} gallery=${{ needs['gallery-repair'].result }} signals=${{ needs.signals.result }}"
      # always(): 앞의 heartbeat 스텝이 죽어도(Kuma 다운·타임아웃) 이건 돈다.
      # 스텝은 암묵적으로 if: success() 라, 두 알림 경로가 한 줄에 묶여 있으면
      # 홈서버가 나쁜 날 Kuma 도 Discord 도 안 온다.
      - uses: ./.github/actions/discord
        if: always()
        with:
          url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          dag: pipeline-weekly
          workflow-file: pipeline-weekly.yml
          always: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
