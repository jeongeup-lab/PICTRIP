name: pipeline-daily
# 일일 수집 DAG — 크론을 잡별로 흩뿌리는 대신 의존성을 needs 로 명시한다.
#
#   sync-kto ─┬─ concentration ── warm ───────┐
#             ├─ embed ─────────┐              ├─ heartbeat
#             └─ detail-prewarm ─┴─ freshness ─┘
#
# embed 가 sync-kto 에 연쇄하는 것이 핵심이다. 신규 스팟은 트리거(UPDATE OF
# first_image_url)에 걸리지 않아 embedding_failures 에도 안 쌓인다 — 이 링크가
# 없으면 새로 들어온 KTO 스팟이 이미지 검색·매칭에서 영영 누락된다.
#
# 05:07 인 이유 둘. KTO 일일 배치가 04:30 KST 에 스탬프를 찍는다(실측:
# max(spots.modified_time) 이 매일 04:30:00). 그 전에 돌면 당일 변경분이 다음날로
# 밀린다 — 04:07 이던 동안 8/21 실행이 당일 배치를 잡은 건 GitHub 큐 지연 26분
# 덕이었다. 그리고 정각이 아닌 이유는 전 세계 크론이 몰려 지연되기 때문이다.
#
# schedule 은 default 브랜치(dev) 기준으로만 동작한다.
on:
  schedule:
    - cron: "7 20 * * *" # 05:07 KST (20:07 UTC + 9h)
  workflow_dispatch:
    inputs:
      embed_limit:
        description: "임베딩 상한 (첫 실행은 백로그가 크다)"
        type: string
        default: "1000"
      prewarm_limit:
        description: "detailCommon2 프리워밍 스팟 수 (KTO 쿼터 예산 — 라이브 상세 조회분을 남긴다)"
        type: string
        default: "400"
      sync_only:
        description: "KTO 수집만 — 프리워밍·임베딩·워밍 생략 (admin 버튼용)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pipeline-daily
  cancel-in-progress: false

jobs:
  # CT111 에 배포된 pictrip-data CLI. .env(DATABASE_URL·KTO_API_KEY)와 .venv 는
  # pipeline-deploy 가 보존하므로 config 가 자동 로드된다.
  sync-kto:
    runs-on: [self-hosted, ct111]
    timeout-minutes: 60
    steps:
      - run: |
          set -euo pipefail
          cd /opt/pictrip-pipeline/pipeline
          /usr/local/bin/uv run pictrip-data sync-daily

  concentration:
    needs: sync-kto
    if: ${{ !inputs.sync_only }}
    runs-on: [self-hosted, ct112]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/api-exec
        with:
          module: scripts.sync_concentration

  detail-prewarm:
    needs: sync-kto
    if: ${{ !inputs.sync_only }}
    runs-on: [self-hosted, ct112]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/api-exec
        with:
          module: scripts.prewarm_details
          args: --limit ${{ inputs.prewarm_limit || '400' }}

  # 신규·이미지 교체 스팟을 CLIP 으로 채운다. --limit 로 묶는 이유는 백로그가
  # 큰 첫 실행이 라이브 api 컨테이너의 CPU 를 하루치 잡아두지 않게 하려는 것.
  embed:
    needs: sync-kto
    if: ${{ !inputs.sync_only }}
    runs-on: [self-hosted, ct112]
    timeout-minutes: 120
    # 임베딩 잡은 admin:embed:running Redis 락을 공유한다 — 겹치면 뒤에 온 잡이
    # RuntimeError 로 죽으므로 워크플로를 가로질러 직렬화한다.
    concurrency:
      group: embedding-job
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/api-exec
        with:
          module: scripts.backfill_embeddings
          args: --limit ${{ inputs.embed_limit || '1000' }}

  # 엣지 워밍은 국내망(ct111)에서 돌아야 KR 콜로가 데워진다 — img-cache-warm 참조.
  warm:
    # 엣지 워밍은 이미지 URL 만 있으면 된다 — 임베딩에 묶으면 CLIP 타임아웃 한 번에
    # 하루치 워밍이 통째로 스킵된다.
    needs: concentration
    uses: ./.github/workflows/img-cache-warm.yml
    permissions:
      contents: read

  # 잡이 성공했다는 것과 데이터가 실제로 전진했다는 것은 다르다. 증분이 워터마크에
  # 갇혔던 54일 동안 sync_runs 는 매일 success 를 찍었다.
  freshness:
    needs: [concentration, detail-prewarm, embed]
    if: always()
    runs-on: [self-hosted, ct112]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/api-exec
        with:
          module: scripts.check_data_freshness

  # embed·concentration 이 조건에 들어가야 하는 이유: freshness 는 테이블 4개의
  # 나이만 보고 임베딩 커버리지를 안 본다. 둘이 빠져 있던 동안 embed 가 죽어도
  # Kuma 는 초록이었다.
  heartbeat:
    needs: [warm, detail-prewarm, embed, concentration, freshness]
    if: always()
    runs-on: [self-hosted, ct111]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/heartbeat
        with:
          url: ${{ secrets.KUMA_PUSH_PIPELINE_DAILY }}
          # skipped(상류 실패로 안 돈 경우)도 down 이다 — success 만 up.
          status: ${{ (needs.warm.result == 'success' && needs['detail-prewarm'].result == 'success' && needs.embed.result == 'success' && needs.concentration.result == 'success' && needs.freshness.result == 'success') && 'up' || 'down' }}
          msg: "daily warm=${{ needs.warm.result }} prewarm=${{ needs['detail-prewarm'].result }} embed=${{ needs.embed.result }} cnctr=${{ needs.concentration.result }} fresh=${{ needs.freshness.result }}"
