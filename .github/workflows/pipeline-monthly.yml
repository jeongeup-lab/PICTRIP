name: pipeline-monthly
# 해외(overseas) 월간 DAG.
#
#   overseas-etl ─┬─ embed ─┐
#                 └─ warm ──┴─ heartbeat
#
# ETL 은 Wikidata SPARQL(36개국) + Commons 이미지 메타 + ko.wikipedia 설명까지
# 한 번에 처리한다. 설명 백필은 예전에 별도 수동 runbook 이라 신규 해외 스팟이
# Wikidata 한 줄 설명만 가진 채 남았다 — sync-overseas 안으로 접어 넣었다.
#
# 임베딩과 무관하게 이미지 URL 은 ETL 직후 확정되므로 warm 은 etl 에만 연쇄한다.
#
# schedule 은 default 브랜치(dev) 기준으로만 동작한다.
on:
  schedule:
    - cron: "13 18 1 * *" # 매월 2일 03:13 KST (1일 18:13 UTC + 9h)
  workflow_dispatch:
    inputs:
      skip_etl:
        description: "ETL 건너뛰고 임베딩만 — ETL 이 잘려 embed 가 skip 된 뒤 백로그를 메울 때"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pipeline-monthly
  cancel-in-progress: false

jobs:
  overseas-etl:
    if: ${{ !inputs.skip_etl }}
    runs-on: [self-hosted, ct111]
    # 36개국 순차 SPARQL. 2026-08-19 실측 5.8분/국 = 207분 — WDQS 가 느리고 504 가
    # 잦아 재시도(5회/최대 120초)가 그대로 벽시계에 얹힌다. 120분이면 21개국에서 잘린다.
    timeout-minutes: 300
    steps:
      - run: |
          set -euo pipefail
          cd /opt/pictrip-pipeline/pipeline
          /usr/local/bin/uv run pictrip-data sync-overseas

  embed:
    needs: overseas-etl
    if: ${{ always() && needs.overseas-etl.result != 'failure' && needs.overseas-etl.result != 'cancelled' }}
    runs-on: [self-hosted, ct112]
    timeout-minutes: 120
    # 임베딩 잡은 admin:embed:running Redis 락을 공유한다 — 겹치면 뒤에 온 잡이
    # RuntimeError 로 죽으므로 워크플로를 가로질러 직렬화한다.
    concurrency:
      group: embedding-job
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/api-exec
        with:
          module: scripts.embed_overseas

  warm:
    needs: overseas-etl
    if: ${{ always() && needs.overseas-etl.result != 'failure' && needs.overseas-etl.result != 'cancelled' }}
    uses: ./.github/workflows/img-cache-warm.yml
    permissions:
      contents: read

  heartbeat:
    permissions:
      actions: read
    needs: [embed, warm]
    if: always()
    runs-on: [self-hosted, ct111]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/heartbeat
        with:
          url: ${{ secrets.KUMA_PUSH_PIPELINE_MONTHLY }}
          status: ${{ (needs.embed.result == 'success' && needs.warm.result == 'success') && 'up' || 'down' }}
          msg: "monthly embed=${{ needs.embed.result }} warm=${{ needs.warm.result }}"
      - uses: ./.github/actions/discord
        with:
          url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          dag: pipeline-monthly
          workflow-file: pipeline-monthly.yml
          always: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
