name: overseas-backfill-thumbs
# One-off ops: rewrite overseas_spots.image_url from Special:FilePath redirects to
# direct upload.wikimedia.org 1200px thumbs — kills the ~0.6s redirect hop and the
# 960px-bucket upscale blur. Runs pictrip-data backfill-overseas-thumbs on CT111
# (the deployed .env carries DATABASE_URL). Embeddings are preserved: image content
# is unchanged, so this avoids a needless full re-embed.
# workflow_dispatch runs from the default branch (dev), so this is only triggerable
# after merge — and after pipeline-deploy has shipped the CLI to CT111.
# Dry run by default; dispatch again with write: true after checking the count.
on:
  workflow_dispatch:
    inputs:
      write:
        description: "Actually write (unchecked = dry-run count only)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: overseas-backfill-thumbs
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: [self-hosted, ct111]
    steps:
      # pipeline-deploy keeps /opt/pictrip-pipeline in sync; .env and .venv persist
      # across deploys, so config auto-loads here.
      - run: |
          set -euo pipefail
          cd /opt/pictrip-pipeline/pipeline
          if [ "$WRITE" = "true" ]; then
            /usr/local/bin/uv run pictrip-data backfill-overseas-thumbs
          else
            /usr/local/bin/uv run pictrip-data backfill-overseas-thumbs --dry-run
          fi
        env:
          WRITE: ${{ inputs.write }}
