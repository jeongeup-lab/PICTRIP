name: mobile-ota
# JS-only over-the-air update (EAS Update). Runs automatically on every merge
# to dev that touches mobile/ — installed TestFlight apps pick it up within
# minutes, no store build or review. Native changes (new module, permission,
# SDK bump) still need mobile-deploy.yml (v* tag, cut from main): the
# runtimeVersion is appVersion-based, so an update lands on every build sharing
# app.json `version`. That means a native change MUST come with a `version` bump
# — otherwise older builds pick up JS that expects native code they don't have.
on:
  push:
    branches: [dev]
    paths: ["mobile/**", ".github/workflows/mobile-ota.yml"]
  workflow_dispatch:
    inputs:
      branch:
        description: "EAS Update branch (maps to channel)"
        type: choice
        options: [production, preview]
        default: production
      message:
        description: "Update message"
        type: string
        required: true
# Publish in order; never cancel an update mid-publish.
concurrency:
  group: mobile-ota
  cancel-in-progress: false
defaults:
  run:
    working-directory: mobile
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run format:check && npm test
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # EXPO_PUBLIC_* values are inlined into the JS bundle at export time, and
      # eas.json build.*.env applies only to `eas build` — `eas update` bundles
      # locally with the runner's env. Without this step the OTA ships empty
      # keys (Kakao map/login, Google login all dead) and overwrites working
      # store builds. Update branch names match eas.json build profile names.
      - name: Load EXPO_PUBLIC_* from eas.json build env
        run: >
          jq -r --arg p "$UPDATE_BRANCH"
          '.build[$p].env | to_entries[] | "\(.key)=\(.value)"'
          eas.json >> "$GITHUB_ENV"
        env:
          UPDATE_BRANCH: ${{ inputs.branch || 'production' }}
      # env indirection keeps commit messages (quotes, backticks) out of the
      # shell command line. Push events fall back to the merge commit message.
      - run: eas update --branch "$UPDATE_BRANCH" --message "$UPDATE_MESSAGE" --non-interactive
        env:
          UPDATE_BRANCH: ${{ inputs.branch || 'production' }}
          UPDATE_MESSAGE: ${{ inputs.message || github.event.head_commit.message }}
