name: gallery-backfill
# 갤러리(다중 이미지) centroid 임베딩 일일 백필 — 매칭 품질 P1(PR #155)의 적재 경로.
# 같은 detailImage2 응답을 spot_images 에도 적재한다(URL·cpyrht_div_cd) — 상세화면
# 갤러리가 쓰는 행이라, KTO 쿼터를 추가로 쓰지 않고 상세 lazy fetch 몫을 줄인다.
# attraction 스팟 11.6k를 KTO detailImage2 일일 쿼터(~1,000콜, 초과 시 429) 안에서
# 하루 800스팟씩 소진될 때까지 나눠 채운다 — 상세화면 lazy fetch 등 앱 트래픽
# 몫으로 ~200콜 헤드룸을 남긴다. 잡은 resumable(실패 스팟은 행을 안 써서 다음
# 실행이 이어받음), 전량 적재 후에는 신규/이미지 교체 스팟만 잡혀 사실상 no-op.
# schedule 은 default 브랜치 기준으로 동작하므로 dev 머지 후부터 유효.
on:
  schedule:
    - cron: "0 21 * * *" # 06:00 KST (UTC+9) — KTO 쿼터 리셋(자정) 후, 캐시 워밍(05:00)과 겹치지 않게
  workflow_dispatch:

# 최소 권한: 파이썬 스크립트만 실행하고 git/API 쓰기에 GITHUB_TOKEN 을 쓰지 않는다.
permissions: {}

# 하루 한 번짜리 작업이 겹치지 않게 가드. 진행 중인 실행은 취소하지 않는다.
concurrency:
  group: gallery-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: [self-hosted, ct112]
    timeout-minutes: 60
    steps:
      # 이미지·/app/.env 마운트·DB 경로를 이미 가진 실행 중인 compose api 컨테이너
      # (이름은 api-host[-_]api[-_]N, :8000 퍼블리시)에 exec 한다. 새 컨테이너를
      # 띄우지 않는다.
      - run: |
          cid="$(docker ps -q --filter "publish=8000" | head -n1)"
          if [ -z "$cid" ]; then echo "api container not found on :8000"; exit 1; fi
          docker exec "$cid" python -m scripts.backfill_gallery_embeddings --limit 800
