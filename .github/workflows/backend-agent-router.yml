name: backend-agent-router
# 여행 탭 라우터를 도구 호출 경로로 켜고 끈다 — CT112 .env 한 줄과 컨테이너 재기동.
#
# .env 는 컨테이너에 읽기 전용으로 마운트되고 Settings 는 import 시점에 읽는다.
# 그래서 값을 바꾸면 재기동이 필요하다. 배포와 달리 이미지는 그대로다.
#
# 되돌리기: router=branches 로 같은 워크플로를 다시 돌린다.
on:
  workflow_dispatch:
    inputs:
      router:
        description: "branches(기존 결정적 라우팅) | tools(도구 호출 루프)"
        type: choice
        options: [branches, tools]
        required: true

permissions: {}

concurrency:
  group: agent-router
  cancel-in-progress: false

jobs:
  toggle:
    runs-on: [self-hosted, ct112]
    env:
      ROUTER: ${{ inputs.router }}
    steps:
      - run: |
          set -euo pipefail
          case "$ROUTER" in branches|tools) ;; *) echo "bad router: $ROUTER"; exit 1 ;; esac
          envfile=/opt/pictrip-api/.env
          [ -f "$envfile" ] || { echo "no env at $envfile"; exit 1; }

          before="$(grep -E '^AGENT_ROUTER=' "$envfile" || echo '(unset — 기본 branches)')"
          echo "before: $before"

          tmp="$(mktemp)"
          grep -vE '^AGENT_ROUTER=' "$envfile" > "$tmp"
          echo "AGENT_ROUTER=$ROUTER" >> "$tmp"
          install -m 600 "$tmp" "$envfile"
          rm -f "$tmp"
          echo "after:  $(grep -E '^AGENT_ROUTER=' "$envfile")"

      - run: |
          set -euo pipefail
          cid="$(docker ps -q --filter "publish=8000" | head -n1)"
          [ -n "$cid" ] || { echo "api container not found on :8000"; exit 1; }
          docker restart "$cid" >/dev/null

          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "api healthy"; exit 0
            fi
            sleep 2
          done
          echo "api did not come back healthy in 60s"; exit 1

      - run: |
          set -euo pipefail
          cid="$(docker ps -q --filter "publish=8000" | head -n1)"
          echo "=== 라우터 확인 (질문 한 건) ==="
          body="$(curl -fsS --max-time 90 -X POST http://127.0.0.1:8000/v1/agent/chat \
            -H 'Content-Type: application/json' \
            -d '{"clientRequestId":"router-check","message":"통영 바다 보이는 카페","history":[]}')"
          echo "$body" | grep -oE '"label": "[^"]*"' | head -6
          echo "$body" | grep -q '"answerText"' || { echo "답변이 오지 않았다"; exit 1; }

          routed="$(docker logs --since 3m "$cid" 2>&1 | grep -E 'agent.search.routed' | tail -1)"
          echo "${routed:-(라우팅 로그 없음)}"
          if [ "$ROUTER" = "tools" ]; then
            echo "$routed" | grep -q 'router=tools' || {
              echo "플래그가 실제 요청에 안 먹었다 — .env 는 바뀌었는데 경로가 그대로다"; exit 1; }
          elif [ -n "$routed" ]; then
            echo "$routed" | grep -q 'router=tools' && {
              echo "branches 로 되돌렸는데 여전히 tools 를 탄다"; exit 1; }
          fi
          echo "라우터=$ROUTER 확인"
