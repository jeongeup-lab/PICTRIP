name: admin-drift
# admin static/ must stay byte-identical to admin/mockups/ (UI SSOT).
# Split out of pr-check.yml so it only runs when the served copy or the SSOT
# actually change — pr-check re-runs on every PR body edit, this must not.
on:
  pull_request:
    paths:
      - "backend/app/modules/admin/static/**"
      - "admin/mockups/**"
      - ".github/scripts/check-admin-mockup-drift.sh"
      - ".github/workflows/admin-drift.yml"
concurrency:
  group: admin-drift-${{ github.ref }}
  cancel-in-progress: true
jobs:
  admin-mockup-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Admin static ↔ mockups drift check
        run: bash .github/scripts/check-admin-mockup-drift.sh
