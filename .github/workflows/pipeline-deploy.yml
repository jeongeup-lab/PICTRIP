# CD for the pictrip-data pipeline. On push to dev touching pipeline/**, the
# self-hosted runner on CT111 syncs the repo's pipeline/ into /opt/pictrip-pipeline
# and re-resolves deps. 수집 스케줄은 CT111 systemd 타이머가 아니라
# pipeline-daily/weekly/monthly 워크플로가 쥔다 — 다음 실행이 새 코드를 쓴다.
# .env (secrets) 와 .venv 는 배포마다 보존된다.
name: pipeline-deploy

on:
  push:
    branches: [dev]
    paths: ["pipeline/**", ".github/workflows/pipeline-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, ct111]
    steps:
      - uses: actions/checkout@v4
      - name: Sync to /opt/pictrip-pipeline
        run: |
          set -euo pipefail
          command -v rsync >/dev/null || { apt-get update -qq && apt-get install -y -qq rsync; }
          APP=/opt/pictrip-pipeline/pipeline
          rsync -a --delete \
            --exclude='.env' --exclude='.venv' --exclude='__pycache__' --exclude='.pytest_cache' \
            "$GITHUB_WORKSPACE/pipeline/" "$APP/"
          cd "$APP"
          /usr/local/bin/uv sync --no-dev
          echo "deployed $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
