name: agent-axis-probe
# 여행 탭 칩 재설계용 읽기 전용 실측 — CT112 라이브 api 컨테이너에 exec 해서
# CT110 DB를 조회한다(로컬·CF에서 CT110으로 가는 경로가 없다). 쓰기 없음.
# 재는 것: 카테고리 키워드가 lcls_systm_codes 에 실제로 걸리는지 · 집중률 커버리지 ·
# moods 적재 여부 · searchFestival2 로 오늘 열리는 축제 수.
# 워크플로 파일만 바뀌므로 backend-deploy(paths: backend/**) 는 돌지 않는다.
on:
  workflow_dispatch:
    inputs:
      keywords:
        description: "쉼표 구분 카테고리 키워드 (비우면 기본 세트)"
        type: string
        default: ""

permissions: {}

concurrency:
  group: agent-axis-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, ct112]
    env:
      KEYWORDS: ${{ inputs.keywords }}
    steps:
      - run: |
          set -euo pipefail
          cid="$(docker ps -q --filter "publish=8000" | head -n1)"
          if [ -z "$cid" ]; then echo "api container not found on :8000"; exit 1; fi
          docker exec -i -e KEYWORDS="$KEYWORDS" "$cid" python - <<'PY'
          import asyncio
          import os
          from datetime import datetime, timedelta, timezone

          from sqlalchemy import text

          from app.core.db import async_session_factory
          from app.kto.client import KtoClient, KtoService
          from app.modules.agent.repositories import find_category_codes
          from app.modules.spots.services import attraction_category_sql

          KST = timezone(timedelta(hours=9))

          DEFAULT_KEYWORDS = [
              "계곡", "해수욕장", "해변", "폭포", "섬", "동굴", "숲", "수목원",
              "박물관", "미술관", "전시관", "아쿠아리움", "공연장", "체험관",
              "사찰", "고택", "전망대", "테마파크", "동물원", "공원", "산책로",
              "시장", "온천", "등대", "야경",
          ]

          ELIGIBLE = (
              "spots.show_flag = 1 "
              "AND spots.first_image_url IS NOT NULL AND spots.first_image_url <> '' "
              "AND ({attraction})"
          ).format(attraction=attraction_category_sql())


          def head(title: str) -> None:
              print(f"\n=== {title} ===", flush=True)


          async def scalar(session, sql: str, params: dict | None = None) -> int:
              row = await session.execute(text(sql), params or {})
              return int(row.scalar_one())


          async def probe_coverage(session) -> None:
              head("1. 모수 · 집중률 커버리지")
              total = await scalar(session, f"SELECT count(*) FROM spots WHERE {ELIGIBLE}")
              rated = await scalar(
                  session,
                  "SELECT count(*) FROM spots "
                  "JOIN spot_concentration sc ON sc.content_id = spots.content_id "
                  f"WHERE {ELIGIBLE}",
              )
              pct = (rated / total * 100) if total else 0.0
              print(f"  eligible attraction spots : {total}")
              print(f"  with concentration_rate   : {rated}  ({pct:.1f}%)")
              print("  (find_candidates(rated_only=True) 는 INNER JOIN — quiet/popular 는 이 모수만 본다)")

              rows = await session.execute(
                  text(
                      "WITH scored AS ("
                      "  SELECT round(greatest(1.0, cume_dist() OVER "
                      "    (ORDER BY sc.concentration_rate) * 100))::int AS pct"
                      "  FROM spots"
                      "  JOIN spot_concentration sc ON sc.content_id = spots.content_id"
                      f"  WHERE {ELIGIBLE}"
                      ") SELECT count(*) FILTER (WHERE pct <= 30) AS quiet,"
                      "        count(*) FILTER (WHERE pct >= 70) AS popular,"
                      "        count(*) AS rated FROM scored"
                  )
              )
              quiet, popular, rated_all = rows.one()
              print(f"  전국 무필터 기준 quiet(<=30%) : {quiet} / popular(>=70%) : {popular} / rated : {rated_all}")
              print("  (실제 조회는 코드·지역 필터를 먼저 걸고 그 안에서 cume_dist 를 다시 잡는다)")

              head("2. 시도별 커버리지 (addr1 앞 토큰)")
              rows = await session.execute(
                  text(
                      "SELECT split_part(spots.addr1, ' ', 1) AS sido,"
                      "       count(*) AS eligible,"
                      "       count(sc.content_id) AS rated"
                      "  FROM spots"
                      "  LEFT JOIN spot_concentration sc ON sc.content_id = spots.content_id"
                      f" WHERE {ELIGIBLE} AND spots.addr1 IS NOT NULL"
                      " GROUP BY 1 ORDER BY 2 DESC LIMIT 25"
                  )
              )
              for sido, eligible, rated_n in rows:
                  share = (rated_n / eligible * 100) if eligible else 0.0
                  print(f"  {sido:<8} eligible {eligible:>6}   rated {rated_n:>6}  ({share:>5.1f}%)")


          async def probe_categories(session) -> None:
              head("3. lcls_systm3 이름별 스팟 수 (상위 60)")
              rows = await session.execute(
                  text(
                      "SELECT c.lcls_systm1_nm, c.lcls_systm2_nm, c.lcls_systm3_nm, count(*) AS n"
                      "  FROM spots"
                      "  JOIN lcls_systm_codes c ON c.lcls_systm3_cd = spots.lcls_systm3"
                      f" WHERE {ELIGIBLE}"
                      " GROUP BY 1, 2, 3 ORDER BY 4 DESC LIMIT 60"
                  )
              )
              for l1, l2, l3, n in rows:
                  print(f"  {n:>6}  {l1} > {l2} > {l3}")

              raw = os.environ.get("KEYWORDS", "").strip()
              keywords = [k.strip() for k in raw.split(",") if k.strip()] or DEFAULT_KEYWORDS

              head("4. 키워드 → find_category_codes → 스팟 수")
              print(f"  {'키워드':<10} {'codes':>6} {'전국':>7} {'rated':>7} {'제주':>6}")
              for kw in keywords:
                  codes = await find_category_codes(session, kw)
                  if not codes:
                      print(f"  {kw:<10} {0:>6} {'-':>7} {'-':>7} {'-':>6}   ← 코드 매칭 없음")
                      continue
                  params = {"codes": codes}
                  code_clause = "AND spots.lcls_systm3 = ANY(CAST(:codes AS text[]))"
                  nationwide = await scalar(
                      session, f"SELECT count(*) FROM spots WHERE {ELIGIBLE} {code_clause}", params
                  )
                  rated_n = await scalar(
                      session,
                      "SELECT count(*) FROM spots "
                      "JOIN spot_concentration sc ON sc.content_id = spots.content_id "
                      f"WHERE {ELIGIBLE} {code_clause}",
                      params,
                  )
                  jeju = await scalar(
                      session,
                      f"SELECT count(*) FROM spots WHERE {ELIGIBLE} {code_clause} "
                      "AND spots.addr1 LIKE '제주%'",
                      params,
                  )
                  print(f"  {kw:<10} {len(codes):>6} {nationwide:>7} {rated_n:>7} {jeju:>6}")


          async def probe_moods(session) -> None:
              head("5. moods / spot_moods 적재 여부")
              moods = await scalar(session, "SELECT count(*) FROM moods")
              spot_moods = await scalar(session, "SELECT count(*) FROM spot_moods")
              print(f"  moods rows      : {moods}")
              print(f"  spot_moods rows : {spot_moods}")
              if moods:
                  rows = await session.execute(
                      text("SELECT code, name FROM moods ORDER BY sort_order, id LIMIT 30")
                  )
                  print("  codes: " + ", ".join(f"{c}({n})" for c, n in rows))
              if spot_moods:
                  rows = await session.execute(
                      text(
                          "SELECT source, count(*), count(DISTINCT content_id)"
                          "  FROM spot_moods GROUP BY 1 ORDER BY 2 DESC"
                      )
                  )
                  for source, n, distinct in rows:
                      print(f"  source {source:<8} rows {n:>7}  spots {distinct:>7}")


          async def probe_festivals() -> None:
              head("6. searchFestival2 — 오늘 열리는 축제")
              kto = KtoClient()
              try:
                  today = datetime.now(KST).date()
                  window_start = (today - timedelta(days=90)).strftime("%Y%m%d")
                  items: list[dict] = []
                  for page in range(1, 6):
                      chunk = await kto.call(
                          KtoService.KOR,
                          "searchFestival2",
                          eventStartDate=window_start,
                          numOfRows=100,
                          pageNo=page,
                          arrange="C",
                      )
                      items.extend(chunk)
                      if len(chunk) < 100:
                          break

                  def parse(raw) -> object:
                      try:
                          return datetime.strptime(str(raw), "%Y%m%d").date()
                      except (TypeError, ValueError):
                          return None

                  active = []
                  for it in items:
                      start, end = parse(it.get("eventstartdate")), parse(it.get("eventenddate"))
                      if start is None or end is None or start > today or end < today:
                          continue
                      active.append((it, end))
                  with_image = [(it, end) for it, end in active if it.get("firstimage")]
                  print(f"  fetched(최근 90일 시작분) : {len(items)}")
                  print(f"  오늘 진행 중             : {len(active)}")
                  print(f"  그중 대표이미지 보유      : {len(with_image)}")
                  by_sido: dict[str, int] = {}
                  for it, _ in with_image:
                      sido = str(it.get("addr1") or "").split(" ")[0] or "(주소없음)"
                      by_sido[sido] = by_sido.get(sido, 0) + 1
                  print("  시도별: " + ", ".join(f"{k} {v}" for k, v in sorted(
                      by_sido.items(), key=lambda kv: kv[1], reverse=True)[:12]))
                  print("  샘플 10:")
                  for it, end in sorted(with_image, key=lambda pair: pair[1])[:10]:
                      days = (end - today).days
                      print(f"    D-{days:<4} {it.get('title')}  ({it.get('addr1')})")
              finally:
                  await kto.aclose()


          async def main() -> None:
              async with async_session_factory() as session:
                  await probe_coverage(session)
                  await probe_categories(session)
                  await probe_moods(session)
              await probe_festivals()
              print("\n--- probe done (read-only) ---")


          asyncio.run(main())
          PY
