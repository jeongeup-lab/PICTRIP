<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PicTrip · 탐색 (크롬 제로 그리드)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root {
    --bg:#FFFFFF; --inset:#F7F7F8; --skeleton:#ECEDEF;
    --ink:#171719; --sec:#5A5C63; --ter:#9396A0;
    --line:rgba(112,115,124,.18);
    --accent:#03C75A; --accent-text:#03A94E;
    --pt:'Pretendard',-apple-system,system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{font-family:var(--pt);background:#e6e7ea;color:var(--ink);
    display:flex;flex-wrap:wrap;gap:56px;justify-content:center;padding:48px 24px}
  .unit{display:flex;flex-direction:column;align-items:center;gap:14px}
  .cap{font-size:13px;font-weight:700;color:#5A5C63;letter-spacing:-.2px}

  .phone{width:402px;height:874px;background:var(--bg);border-radius:46px;
    box-shadow:0 30px 80px rgba(20,18,22,.28);overflow:hidden;position:relative;
    display:flex;flex-direction:column}

  /* B안: 그리드가 상태바 밑까지, 스크림으로 시계 가독성 확보 */
  .statusbar-float{position:absolute;top:0;left:0;right:0;z-index:5;height:54px;
    display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 28px 8px;font-size:15px;font-weight:600}
  .statusbar-float.on-photo{color:#fff}
  .top-scrim{position:absolute;top:0;left:0;right:0;height:92px;z-index:4;
    background:linear-gradient(180deg,rgba(20,18,22,.55) 0%,rgba(20,18,22,.28) 55%,transparent 100%);
    pointer-events:none}

  .grid-wrap{flex:1;overflow:hidden}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;grid-auto-flow:dense}
  .grid.rest{padding-top:54px}
  .tile{aspect-ratio:1;background-size:cover;background-position:center;
    background-color:var(--skeleton)}
  .tile.big{grid-column:span 2;grid-row:span 2}

  .tabbar{display:flex;border-top:1px solid var(--line);padding:9px 8px 26px;
    background:var(--bg);flex-shrink:0}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;font-weight:700;color:var(--ter)}
  .tab.on{color:var(--accent-text)}
  .home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:140px;height:5px;border-radius:3px;background:var(--ink);opacity:.9;z-index:6}
</style>
</head>
<body>

<!-- ① 스크롤 중: 사진이 상태바 아래로 흐르는 상태 -->
<div class="unit">
  <div class="phone">
    <div class="top-scrim"></div>
    <div class="statusbar-float on-photo">
      <span>9:41</span>
      <span style="display:flex;gap:6px;align-items:center">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#fff" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="8" rx="1.6" fill="#fff"/><rect x="23" y="4" width="2" height="4" rx="1" fill="#fff" fill-opacity=".5"/></svg>
      </span>
    </div>
    <div class="grid-wrap">
      <div class="grid" style="margin-top:-46px">
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=101')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=102')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=103')"></div>
        <div class="tile big" style="background-image:url('https://loremflickr.com/800/800/travel,landmark?lock=104')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=105')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=106')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=107')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=108')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=109')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=110')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=111')"></div>
        <div class="tile big" style="background-image:url('https://loremflickr.com/800/800/travel,landmark?lock=112')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=113')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=114')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=115')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=116')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=117')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=118')"></div>
      </div>
    </div>
    <div class="tabbar">
      <div class="tab">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
        홈
      </div>
      <div class="tab on">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        탐색
      </div>
      <div class="tab">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
        지도
      </div>
      <div class="tab">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.6-3.5 4.3-5 7.5-5s5.9 1.5 7.5 5"/></svg>
        마이
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>
  <span class="cap">① 스크롤 중 — 사진이 상태바 밑으로, 상단 그라데이션 스크림 (B안)</span>
</div>

<!-- ② 최상단 정지: 첫 줄이 safe-area 아래에서 시작 -->
<div class="unit">
  <div class="phone">
    <div class="statusbar-float" style="color:var(--ink)">
      <span>9:41</span>
      <span style="display:flex;gap:6px;align-items:center">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="#171719"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#171719" stroke-opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="1.6" fill="#171719"/><rect x="23" y="4" width="2" height="4" rx="1" fill="#171719" fill-opacity=".4"/></svg>
      </span>
    </div>
    <div class="grid-wrap">
      <div class="grid rest">
        <div class="tile big" style="background-image:url('https://loremflickr.com/800/800/travel,landmark?lock=121')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=122')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=123')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=124')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=125')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=126')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=127')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=128')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=129')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=130')"></div>
        <div class="tile big" style="background-image:url('https://loremflickr.com/800/800/travel,landmark?lock=131')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=132')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=133')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=134')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=135')"></div>
        <div class="tile" style="background-image:url('https://loremflickr.com/400/400/travel,landmark?lock=136')"></div>
      </div>
    </div>
    <div class="tabbar">
      <div class="tab">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
        홈
      </div>
      <div class="tab on">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        탐색
      </div>
      <div class="tab">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
        지도
      </div>
      <div class="tab">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.6-3.5 4.3-5 7.5-5s5.9 1.5 7.5 5"/></svg>
        마이
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>
  <span class="cap">② 최상단 정지 — 첫 줄이 상태바 아래서 시작, 스크림 없음</span>
</div>

</body>
</html>
