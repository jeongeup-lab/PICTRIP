<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PicTrip · 인터랙티브 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root {
    --bg:#FFFFFF; --inset:#F7F7F8; --skeleton:#ECEDEF;
    --ink:#171719; --sec:#5A5C63; --ter:#9396A0;
    --line:rgba(112,115,124,.18); --fill:rgba(112,115,124,.08);
    --accent:#03C75A; --accent-text:#03A94E; --accent-fill:rgba(3,199,90,.08);
    --scrim-strong:rgba(16,14,18,.64);
    --glass:rgba(255,255,255,.15); --glass-border:rgba(255,255,255,.22);
    --on-image:#FFFFFF; --on-dim:rgba(255,255,255,.85);
    --pt:'Pretendard',-apple-system,system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{font-family:var(--pt);background:#e6e7ea;color:var(--ink);
    display:flex;justify-content:center;padding:40px 16px}
  .phone{width:402px;height:874px;background:var(--bg);border-radius:46px;
    box-shadow:0 30px 80px rgba(20,18,22,.28);overflow:hidden;position:relative}

  /* 상태바 (오버레이) */
  .statusbar{position:absolute;top:0;left:0;right:0;z-index:40;height:54px;
    display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 28px 8px;font-size:15px;font-weight:600;color:var(--ink);
    pointer-events:none;transition:color .2s}
  .statusbar.light{color:#fff}
  .statusbar .icons{display:flex;gap:6px;align-items:center}
  .statusbar .icons svg .f{fill:currentColor}
  .statusbar .icons svg .o{stroke:currentColor}

  .screen{position:absolute;inset:0;bottom:84px;display:none;flex-direction:column;
    overflow:hidden;background:var(--bg)}
  .screen.active{display:flex}
  .scrollarea{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
  .scrollarea::-webkit-scrollbar{display:none}

  /* ── 홈 ── */
  #screen-home .scrollarea{padding-top:54px}
  .topbar{display:flex;justify-content:center;padding:14px 20px;
    border-bottom:1px solid var(--line)}
  .wordmark{font-size:20px;font-weight:800;letter-spacing:-.5px}
  .wordmark-dot{width:6px;height:6px;border-radius:3px;background:var(--accent);
    display:inline-block;margin-left:3px;margin-bottom:1px}

  /* B안: 포토 카드 타일 */
  .ptiles{display:flex;gap:10px;padding:14px 16px;overflow-x:auto;scrollbar-width:none}
  .ptiles::-webkit-scrollbar{display:none}
  .ptile{width:86px;height:110px;border-radius:14px;overflow:hidden;position:relative;
    background-size:cover;background-position:center;background-color:var(--skeleton);
    flex-shrink:0;box-shadow:0 4px 12px rgba(23,23,25,.08);cursor:pointer;
    transition:opacity .2s}
  .ptile::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 45%,rgba(16,14,18,.68) 100%)}
  .ptile .lb{position:absolute;left:0;right:0;bottom:9px;z-index:2;text-align:center;
    font-size:11.5px;font-weight:800;color:#fff;letter-spacing:.2px}
  .ptile .new{position:absolute;top:8px;right:8px;z-index:2;width:8px;height:8px;
    border-radius:4px;background:var(--accent);box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
  .ptile.seen{opacity:.55}
  .ptile.around{background:linear-gradient(160deg,#E7F8EF,#D3F2E2)}
  .ptile.around::after{display:none}
  .ptile.around .lb{color:var(--accent-text)}
  .ptile.around .ic{position:absolute;top:50%;left:50%;transform:translate(-50%,-64%);
    color:var(--accent-text)}

  /* 게시물 캐러셀 */
  .c-wrap{padding:4px 16px 0}
  .carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
    border-radius:16px;box-shadow:0 10px 24px rgba(23,23,25,.12);
    scrollbar-width:none;height:520px}
  .carousel::-webkit-scrollbar{display:none}
  .slide{width:100%;flex-shrink:0;scroll-snap-align:start;position:relative;
    background-size:cover;background-position:center;background-color:var(--skeleton)}
  .slide::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(20,18,22,.14) 0%,transparent 24%,transparent 46%,var(--scrim-strong) 100%)}
  .counter{position:absolute;top:14px;right:14px;z-index:3;padding:5px 11px;
    border-radius:999px;background:rgba(20,18,22,.45);backdrop-filter:blur(8px);
    font-size:12px;font-weight:700;color:var(--on-image);letter-spacing:.3px}
  .bookmark-btn{position:absolute;top:12px;left:12px;z-index:3;width:36px;height:36px;
    border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);
    cursor:pointer}
  .bookmark-btn svg path{fill:none;stroke:#fff;stroke-width:2;stroke-linejoin:round}
  .bookmark-btn.saved svg path{fill:#fff}
  .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);z-index:3;
    width:34px;height:34px;border-radius:50%;background:var(--glass);
    border:1px solid var(--glass-border);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;pointer-events:none}
  .meta{position:absolute;left:18px;right:18px;bottom:20px;z-index:2;color:var(--on-image)}
  .title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .num{font-size:15px;font-weight:800;color:var(--on-dim);margin-right:2px;
    position:relative;top:-7px}
  .name{font-size:24px;font-weight:800;letter-spacing:-.5px}
  .region-chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;
    font-weight:600;color:var(--on-dim)}
  .region-chip::before{content:"";width:1px;height:12px;background:rgba(255,255,255,.4)}
  .desc{margin-top:10px;font-size:14.5px;line-height:1.55;font-weight:500;color:var(--on-dim);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hint-mid{position:absolute;left:36px;right:36px;top:50%;transform:translateY(-50%);
    z-index:2;display:flex;flex-direction:column;align-items:center;gap:11px}
  .hint-mid .rule{width:100%;height:1px;background:rgba(255,255,255,.68)}
  .hint-mid p{font-size:13.5px;font-weight:700;color:#fff;letter-spacing:-.2px;
    text-shadow:0 1px 10px rgba(16,14,18,.55)}
  .dots{display:flex;gap:5px;justify-content:center;padding:12px 0 14px}
  .dot{width:6px;height:6px;border-radius:3px;background:var(--skeleton);transition:background .2s}
  .dot.on{background:var(--ink)}

  .footer{background:var(--inset);border-top:1px solid var(--line);
    padding:20px;margin-top:8px}
  .footer p{font-size:11.5px;color:var(--ter)}

  /* ── 탐색 ── */
  #screen-explore{background:var(--bg)}
  #screen-explore .scrollarea{padding-top:0}
  .top-scrim{position:absolute;top:0;left:0;right:0;height:92px;z-index:30;
    background:linear-gradient(180deg,rgba(20,18,22,.55) 0%,rgba(20,18,22,.28) 55%,transparent 100%);
    pointer-events:none}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;grid-auto-flow:dense}
  .tile{aspect-ratio:1;background-size:cover;background-position:center;
    background-color:var(--skeleton);cursor:pointer}
  .tile.big{grid-column:span 2;grid-row:span 2}

  /* ── 지도/마이 스텁 ── */
  .stub{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;color:var(--ter);padding-top:54px}
  .stub-icon{width:64px;height:64px;border-radius:50%;background:var(--fill);
    display:flex;align-items:center;justify-content:center}
  .stub p{font-size:13.5px;font-weight:600;color:var(--sec)}
  .stub small{font-size:12px;color:var(--ter)}

  /* ── 탭바 (실앱 미러) ── */
  .tabbar{position:absolute;left:0;right:0;bottom:0;z-index:50;height:84px;
    display:flex;border-top:1px solid var(--line);background:var(--bg);
    padding:9px 8px 26px}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;font-weight:700;color:var(--ter);cursor:pointer}
  .tab svg{stroke:currentColor}
  .tab.on{color:var(--accent-text)}
  .tab.on svg{stroke:var(--accent)}
  .home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:140px;height:5px;border-radius:3px;background:var(--ink);opacity:.9;z-index:60;
    pointer-events:none}

  /* ── 스토리 뷰어 ── */
  .viewer{position:absolute;inset:0;z-index:100;background:#141216;display:none;
    flex-direction:column}
  .viewer.open{display:flex}
  .v-photo{position:absolute;inset:0;background-size:cover;background-position:center;
    transition:background-image .15s}
  .v-photo::before{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(16,14,18,.62) 0%,transparent 22%,transparent 55%,rgba(16,14,18,.78) 100%)}
  .v-top{position:relative;z-index:4;padding-top:54px}
  .v-progress{display:flex;gap:4px;padding:8px 14px 0}
  .v-seg{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.32);overflow:hidden}
  .v-seg i{display:block;height:100%;background:#fff;width:0}
  .v-seg.done i{width:100%}
  .v-seg.cur i{width:55%}
  .v-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;
    color:#fff}
  .v-title{font-size:16px;font-weight:800;letter-spacing:-.2px}
  .v-close{width:32px;height:32px;border-radius:50%;background:var(--glass);
    border:1px solid var(--glass-border);display:flex;align-items:center;
    justify-content:center;cursor:pointer;pointer-events:auto}
  .v-bottom{position:absolute;z-index:4;left:22px;right:22px;bottom:44px;color:#fff}
  .v-badge-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:0}
  .v-rank{width:38px;height:38px;border-radius:50%;background:var(--glass);
    border:1.5px solid var(--glass-border);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
  .v-dday{padding:5px 11px;border-radius:999px;background:var(--accent);
    color:#fff;font-size:13px;font-weight:800}
  .v-tag{display:inline-flex;padding:5px 11px;border-radius:999px;background:var(--glass);
    border:1px solid var(--glass-border);font-size:12px;font-weight:700}
  .v-name{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
  .v-region{font-size:14px;color:var(--on-dim);margin-top:5px}
  .v-line{font-size:13.5px;font-weight:600;color:var(--on-dim);margin-top:9px}
  .v-btns{display:flex;gap:10px;margin-top:18px}
  .v-btn{flex:1;height:48px;border-radius:12px;display:flex;align-items:center;
    justify-content:center;gap:7px;font-size:15px;font-weight:700;cursor:pointer}
  .v-btn.glass{background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(8px);color:#fff}
  .v-btn.solid{background:#fff;color:var(--ink)}
  .v-taps{position:absolute;inset:0;z-index:3;display:flex}
  .v-taps .prev{width:34%}
  .v-taps .next{flex:1}

  /* ── 탐색 → 게시물 모달 ── */
  .postmodal{position:absolute;inset:0;z-index:100;background:rgba(16,14,18,.92);
    display:none;flex-direction:column;justify-content:center;padding:0 16px}
  .postmodal.open{display:flex}
  .pm-close{position:absolute;top:60px;right:20px;z-index:5;width:34px;height:34px;
    border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);
    display:flex;align-items:center;justify-content:center;cursor:pointer}

  .info-btn{position:absolute;top:12px;left:12px;z-index:3;width:32px;height:32px;
    border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);
    cursor:pointer}
  .credit-dim{position:absolute;inset:0;z-index:150;background:rgba(20,18,22,.5);
    display:none}
  .credit-dim.open{display:block}
  .credit-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);
    border-radius:20px 20px 0 0;padding:10px 24px 44px}
  .credit-handle{width:44px;height:5px;border-radius:3px;background:var(--skeleton);
    margin:6px auto 18px}
  .credit-sheet h3{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-bottom:16px}
  .credit-row{display:flex;justify-content:space-between;align-items:center;
    padding:13px 0;border-bottom:1px solid var(--line)}
  .credit-row:last-of-type{border-bottom:none}
  .credit-k{font-size:13px;font-weight:600;color:var(--ter)}
  .credit-v{font-size:14px;font-weight:600;color:var(--ink)}
  .credit-note{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--inset);
    font-size:12px;line-height:1.55;color:var(--sec)}

  .toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(8px);
    z-index:200;background:rgba(23,23,25,.88);color:#fff;font-size:13px;font-weight:600;
    padding:10px 18px;border-radius:999px;opacity:0;transition:all .25s;pointer-events:none;
    white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="phone">
  <div class="statusbar" id="statusbar">
    <span>9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect class="f" x="0" y="7" width="3" height="5" rx="1"/><rect class="f" x="5" y="5" width="3" height="7" rx="1"/><rect class="f" x="10" y="2.5" width="3" height="9.5" rx="1"/><rect class="f" x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect class="o" x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke-opacity=".4"/><rect class="f" x="2" y="2" width="15" height="8" rx="1.6"/><rect class="f" x="23" y="4" width="2" height="4" rx="1" fill-opacity=".4"/></svg>
    </span>
  </div>

  <!-- 홈 -->
  <div class="screen active" id="screen-home">
    <div class="scrollarea">
      <div class="topbar"><span class="wordmark">PICTRIP<span class="wordmark-dot"></span></span></div>
      <div class="ptiles" id="ptiles"></div>
      <div id="feed"></div>
    </div>
  </div>

  <!-- 탐색 -->
  <div class="screen" id="screen-explore">
    <div class="top-scrim"></div>
    <div class="scrollarea"><div class="grid" id="grid"></div></div>
  </div>

  <!-- 지도 스텁 -->
  <div class="screen" id="screen-map">
    <div class="stub">
      <div class="stub-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9396A0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></div>
      <p>지도</p><small>기존 화면 유지 — 이번 개편 범위 아님</small>
    </div>
  </div>

  <!-- 마이 스텁 -->
  <div class="screen" id="screen-my">
    <div class="stub">
      <div class="stub-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9396A0" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.6-3.5 4.3-5 7.5-5s5.9 1.5 7.5 5"/></svg></div>
      <p>마이</p><small>기존 화면 유지 — 이번 개편 범위 아님</small>
    </div>
  </div>

  <!-- 탭바 -->
  <div class="tabbar">
    <div class="tab on" data-tab="home">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
      홈
    </div>
    <div class="tab" data-tab="explore">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      탐색
    </div>
    <div class="tab" data-tab="map">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
      지도
    </div>
    <div class="tab" data-tab="my">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.6-3.5 4.3-5 7.5-5s5.9 1.5 7.5 5"/></svg>
      마이
    </div>
  </div>
  <div class="home-indicator"></div>

  <!-- 스토리 뷰어 -->
  <div class="viewer" id="viewer">
    <div class="v-photo" id="v-photo"></div>
    <div class="v-taps"><span class="prev" id="v-prev"></span><span class="next" id="v-next"></span></div>
    <div class="v-top">
      <div class="v-progress" id="v-progress"></div>
      <div class="v-head">
        <span class="v-title" id="v-title"></span>
        <span class="v-close" id="v-close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
      </div>
    </div>
    <div class="v-bottom" id="v-bottom"></div>
  </div>

  <!-- 탐색 게시물 모달 -->
  <div class="postmodal" id="postmodal">
    <span class="pm-close" id="pm-close"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
    <div id="pm-body"></div>
  </div>

  <!-- 사진 출처 시트 -->
  <div class="credit-dim" id="credit" onclick="this.classList.remove('open')">
    <div class="credit-sheet" onclick="event.stopPropagation()">
      <div class="credit-handle"></div>
      <h3>사진 정보</h3>
      <div class="credit-row"><span class="credit-k">촬영</span><span class="credit-v" id="cr-author"></span></div>
      <div class="credit-row" onclick="toast('라이선스 전문으로 이동 (프로토타입)')" style="cursor:pointer">
        <span class="credit-k">라이선스</span>
        <span class="credit-v" style="display:inline-flex;align-items:center;gap:5px">
          <span id="cr-license"></span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9396A0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </div>
      <div class="credit-row" onclick="toast('원본 파일 페이지로 이동 (프로토타입)')" style="cursor:pointer">
        <span class="credit-k">제공</span>
        <span class="credit-v" style="display:inline-flex;align-items:center;gap:5px">
          Wikimedia Commons
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9396A0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const F = (kw, lock, s=804, h=1042) => `https://loremflickr.com/${s}/${h}/${kw}?lock=${lock}`;
const T = (kw, lock) => `https://loremflickr.com/240/300/${kw}?lock=${lock}`;
const S = (kw, lock) => `https://loremflickr.com/160/160/${kw}?lock=${lock}`;

const POSTS = [
  { hero:{img:F('santorini',11), name:'산토리니', region:'그리스',
      desc:'그리스 에게해 키클라데스 제도의 화산섬'},
    matches:[
      {img:F('colorful,village',13), name:'감천문화마을', region:'부산 사하구',

const CREDITS = {
  '산토리니':{author:'Maria Papadopoulou', license:'CC BY-SA 4.0'},
  '아라시야마':{author:'Kenta Mabuchi', license:'CC BY-SA 3.0'},
  '인터라켄':{author:'Dominik Landwehr', license:'CC BY 4.0'},
  '몰디브':{author:'Ahmed Nazeer', license:'CC BY-SA 4.0'},
};
function openCredit(name){
  const c = CREDITS[name] || {author:'-', license:'-'};
  document.getElementById('cr-author').textContent = c.author;
  document.getElementById('cr-license').textContent = c.license;
  document.getElementById('credit').classList.add('open');
}

const seen = new Set();
const $ = id => document.getElementById(id);
const toastEl = $('toast');
let toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1600);
}

/* ── 홈: 채널 타일 ── */
function renderTiles(){
  $('ptiles').innerHTML = CHANNELS.map((c,i)=>{
    if(c.key==='around') return `
      <div class="ptile around ${seen.has(i)?'seen':''}" onclick="openViewer(${i})">
        <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></span>
        <span class="lb">Around</span>
      </div>`;
    return `
      <div class="ptile ${seen.has(i)?'seen':''}" style="background-image:url('${c.tile}')" onclick="openViewer(${i})">
        ${seen.has(i)?'':'<span class="new"></span>'}
        <span class="lb">${c.label}</span>
      </div>`;
  }).join('');
}

/* ── 홈: 피드 ── */
function slideHTML(p, idx, total, postIdx){
  if(idx===0){
    return `<div class="slide" style="background-image:url('${p.hero.img}')">
      <div class="counter">1/${total}</div>
      <div class="info-btn" onclick="openCredit('${p.hero.name}');event.stopPropagation()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.5" r="0.5" fill="#fff"/></svg>
      </div>
      <div class="meta">
        <div class="title-row"><span class="name">${p.hero.name}</span><span class="region-chip">${p.hero.region}</span></div>
        <div class="desc">${p.hero.desc}</div>
      </div>
    </div>`;
  }
  const m = p.matches[idx-1];
  return `<div class="slide" style="background-image:url('${m.img}')">
    <div class="counter">${idx+1}/${total}</div>
    <div class="bookmark-btn" onclick="toggleSave(this,event)"><svg width="17" height="17" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></div>
    <div class="meta">
      <div class="title-row"><span><span class="num">${idx}</span><span class="name">${m.name}</span></span><span class="region-chip">${m.region}</span></div>
      <div class="desc">${m.ov}</div>
    </div>
  </div>`;
}
function postHTML(p, postIdx){
  const total = 1 + p.matches.length;
  const slides = Array.from({length:total},(_,i)=>slideHTML(p,i,total,postIdx)).join('');
  const dots = Array.from({length:total},(_,i)=>`<span class="dot ${i===0?'on':''}"></span>`).join('');
  return `<div class="c-wrap">
    <div class="carousel" data-post="${postIdx}">${slides}</div>
  </div>
  <div class="dots" id="dots-${postIdx}">${dots}</div>`;
}
function wireCarousel(car){
  car.addEventListener('scroll', ()=>{
    requestAnimationFrame(()=>{
      const idx = Math.round(car.scrollLeft / car.clientWidth);
      const dots = $('dots-'+car.dataset.post).children;
      [...dots].forEach((d,i)=>d.classList.toggle('on', i===idx));
    });
  });
}
let feedCount = 0;
function appendPosts(n){
  const frag = document.createElement('div');
  let html = '';
  for(let k=0;k<n;k++){ html += postHTML(POSTS[feedCount % POSTS.length], feedCount); feedCount++; }
  frag.innerHTML = html;
  const feed = $('feed');
  [...frag.children].forEach(el=>feed.appendChild(el));
  feed.querySelectorAll('.carousel:not([data-wired])').forEach(car=>{
    car.dataset.wired = '1'; wireCarousel(car);
  });
}
function renderFeed(){
  appendPosts(4);
  const area = document.querySelector('#screen-home .scrollarea');
  area.addEventListener('scroll', ()=>{
    if(area.scrollTop + area.clientHeight > area.scrollHeight - 800) appendPosts(2);
  });
}
function toggleSave(el, ev){
  ev.stopPropagation();
  el.classList.toggle('saved');
  toast(el.classList.contains('saved')?'스크랩에 저장했어요':'저장을 해제했어요');
}

/* ── 탐색 그리드 ── */
let gridCount = 0;
function appendTiles(n){
  let html = '';
  for(let k=0;k<n;k++){
    const i = gridCount++;
    const img = `https://loremflickr.com/400/400/travel,landmark?lock=${101+i}`;
    html += `<div class="tile ${i%7===3?'big':''}" style="background-image:url('${img}')" onclick="openPost(${i%POSTS.length})"></div>`;
  }
  $('grid').insertAdjacentHTML('beforeend', html);
}
function renderGrid(){
  appendTiles(24);
  const area = document.querySelector('#screen-explore .scrollarea');
  area.addEventListener('scroll', ()=>{
    if(area.scrollTop + area.clientHeight > area.scrollHeight - 800) appendTiles(12);
  });
}

/* ── 탭 전환 ── */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    $('screen-'+t.dataset.tab).classList.add('active');
    $('statusbar').classList.toggle('light', t.dataset.tab==='explore');
  });
});

/* ── 스토리 뷰어 ── */
let vc = 0, vi = 0;
function openViewer(ci){
  vc = ci; vi = 0;
  $('viewer').classList.add('open');
  $('statusbar').classList.add('light');
  renderViewer();
}
function closeViewer(){
  seen.add(vc);
  $('viewer').classList.remove('open');
  const active = document.querySelector('.tab.on').dataset.tab;
  $('statusbar').classList.toggle('light', active==='explore');
  renderTiles();
}
function renderViewer(){
  const ch = CHANNELS[vc], c = ch.cards[vi];
  $('v-photo').style.backgroundImage = `url('${c.img}')`;
  $('v-title').textContent = ch.label;
  $('v-progress').innerHTML = ch.cards.map((_,i)=>
    `<span class="v-seg ${i<vi?'done':i===vi?'cur':''}"><i></i></span>`).join('');
  let badge = '';
  if(c.rank) badge = `<div class="v-badge-row"><div class="v-rank">${c.rank}</div></div>`;
  if(c.dday) badge = `<div class="v-badge-row"><span class="v-dday">${c.dday}</span></div>`;
  if(c.tag) badge = `<div class="v-badge-row"><span class="v-tag">${c.tag}</span></div>`;
  const btns = ch.noActions ? '' : `
    <div class="v-btns">
      <div class="v-btn glass" onclick="toast('스크랩에 저장했어요');event.stopPropagation()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>저장</div>
      <div class="v-btn solid" onclick="toast('관광지 상세로 이동 (프로토타입)');event.stopPropagation()">자세히 보기</div>
    </div>`;
  $('v-bottom').innerHTML = `${badge}
    <div class="v-name">${c.name}</div>
    <div class="v-region">${c.region}</div>
    ${c.line?`<div class="v-line">${c.line}</div>`:''}
    ${btns}`;
}
$('v-next').addEventListener('click', ()=>{
  if(vi < CHANNELS[vc].cards.length-1){ vi++; renderViewer(); }
  else { seen.add(vc); if(vc < CHANNELS.length-1){ vc++; vi=0; renderViewer(); renderTiles(); } else closeViewer(); }
});
$('v-prev').addEventListener('click', ()=>{
  if(vi>0){ vi--; renderViewer(); }
  else if(vc>0){ vc--; vi=CHANNELS[vc].cards.length-1; renderViewer(); }
});
$('v-close').addEventListener('click', closeViewer);

/* ── 탐색 → 게시물 모달 ── */
function openPost(pi){
  $('pm-body').innerHTML = postHTML(POSTS[pi], 'pm');
  $('postmodal').classList.add('open');
  const car = document.querySelector('#pm-body .carousel');
  car.addEventListener('scroll', ()=>{
    requestAnimationFrame(()=>{
      const idx = Math.round(car.scrollLeft / car.clientWidth);
      const dots = $('dots-pm').children;
      [...dots].forEach((d,i)=>d.classList.toggle('on', i===idx));
    });
  });
}
$('pm-close').addEventListener('click', ()=>$('postmodal').classList.remove('open'));

renderTiles(); renderFeed(); renderGrid();
</script>
