<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PicTrip · 홈 (서클 + 해외→국내 피드)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  /* ── theme.ts 미러 ── */
  :root {
    --bg:#FFFFFF; --inset:#F7F7F8; --skeleton:#ECEDEF;
    --ink:#171719; --sec:#5A5C63; --ter:#9396A0;
    --line:rgba(112,115,124,.18); --fill:rgba(112,115,124,.08);
    --accent:#03C75A; --accent-text:#03A94E; --accent-fill:rgba(3,199,90,.08);
    --scrim:rgba(20,18,22,.50); --scrim-strong:rgba(16,14,18,.64);
    --glass:rgba(255,255,255,.15); --glass-border:rgba(255,255,255,.22);
    --on-image:#FFFFFF; --on-dim:rgba(255,255,255,.85);
    --pt:'Pretendard',-apple-system,system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{font-family:var(--pt);background:#e6e7ea;color:var(--ink);
    display:flex;flex-wrap:wrap;gap:56px;justify-content:center;padding:48px 24px}
  .unit{display:flex;flex-direction:column;align-items:center;gap:14px}
  .cap{font-size:13px;font-weight:700;color:#5A5C63;letter-spacing:-.2px}

  .phone{width:402px;height:874px;background:var(--bg);border-radius:46px;
    box-shadow:0 30px 80px rgba(20,18,22,.28);overflow:hidden;position:relative;
    display:flex;flex-direction:column}

  .statusbar{height:54px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 28px 8px;font-size:15px;font-weight:600;letter-spacing:-.2px;flex-shrink:0}
  .statusbar svg{display:block}

  /* 상단 바 — 현행 홈 워드마크 관례 */
  .topbar{display:flex;justify-content:center;align-items:flex-end;
    padding:14px 20px;border-bottom:1px solid var(--line)}
  .wordmark{font-size:20px;font-weight:800;letter-spacing:-.5px}
  .wordmark-dot{width:6px;height:6px;border-radius:3px;background:var(--accent);
    display:inline-block;margin-left:3px;margin-bottom:1px}

  .scroll{flex:1;overflow:hidden;display:flex;flex-direction:column}

  /* ── 스토리 서클 줄: 6채널, 5개 반 노출 ── */
  .circles{display:flex;gap:13px;padding:16px 0 14px 16px;overflow:hidden;
    border-bottom:1px solid var(--line);flex-shrink:0}
  .circle{display:flex;flex-direction:column;align-items:center;gap:7px;flex-shrink:0;width:58px}
  .ring{width:58px;height:58px;border-radius:50%;padding:2.5px;flex-shrink:0}
  .ring.unseen{background:linear-gradient(140deg,var(--accent),#02A94E 70%,#059669)}
  .ring.seen{background:var(--line)}
  .thumb{width:100%;height:100%;border-radius:50%;border:2.5px solid var(--bg);
    background-size:cover;background-position:center;background-color:var(--skeleton);
    display:flex;align-items:center;justify-content:center}
  .thumb.around{background-color:#E7F8EF;background-image:none;color:var(--accent-text)}
  .circle-label{font-size:11px;font-weight:700;letter-spacing:-.1px;color:var(--sec)}
  .circle.seen-label .circle-label{color:var(--ter);font-weight:600}

  /* ── 게시물: 카드 인셋 (C안 · 뉴뉴 타이틀 포맷) ── */
  .c-wrap{padding:16px 16px 0;flex-shrink:0}
  .card{width:100%;height:520px;border-radius:16px;overflow:hidden;position:relative;
    background-size:cover;background-position:center;background-color:var(--skeleton);
    box-shadow:0 10px 24px rgba(23,23,25,.12)}
  .card::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(20,18,22,.14) 0%,transparent 24%,transparent 46%,var(--scrim-strong) 100%)}
  .counter{position:absolute;top:14px;right:14px;z-index:3;padding:5px 11px;
    border-radius:999px;background:rgba(20,18,22,.45);backdrop-filter:blur(8px);
    font-size:12px;font-weight:700;color:var(--on-image);letter-spacing:.3px}
  .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);z-index:3;
    width:34px;height:34px;border-radius:50%;background:var(--glass);
    border:1px solid var(--glass-border);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center}
  .meta{position:absolute;left:18px;right:18px;bottom:20px;z-index:2;color:var(--on-image)}
  .title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .name{font-size:24px;font-weight:800;letter-spacing:-.5px}
  .region-chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;
    font-weight:600;color:var(--on-dim)}
  .region-chip::before{content:"";width:1px;height:12px;background:rgba(255,255,255,.4)}
  .copy{margin-top:10px;font-size:14.5px;line-height:1.55;font-weight:500;color:var(--on-dim)}
  .copy b{font-weight:700;color:var(--on-image)}

  .dots{display:flex;gap:5px;justify-content:center;padding:12px 0 10px;flex-shrink:0}
  .dot{width:6px;height:6px;border-radius:3px;background:var(--skeleton)}
  .dot.on{background:var(--ink)}

  .peek{flex-shrink:0;margin:0 16px;border-radius:16px 16px 0 0;overflow:hidden;
    background-size:cover;background-position:center 30%;height:96px}

  /* ── 탭바 ── */
  .tabbar{display:flex;border-top:1px solid var(--line);padding:9px 8px 26px;
    background:var(--bg);flex-shrink:0;margin-top:auto}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;font-weight:700;color:var(--ter)}
  .tab.on{color:var(--accent-text)}
  .home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:140px;height:5px;border-radius:3px;background:var(--ink);opacity:.9;z-index:5}
</style>
</head>
<body>

<div class="unit">
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span style="display:flex;gap:6px;align-items:center">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="#171719"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#171719" stroke-width="1.6" stroke-linecap="round"><path d="M2 4.5a9 9 0 0 1 12 0"/><path d="M4.5 7a5.5 5.5 0 0 1 7 0"/><circle cx="8" cy="10" r="1.2" fill="#171719" stroke="none"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#171719" stroke-opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="1.6" fill="#171719"/><rect x="23" y="4" width="2" height="4" rx="1" fill="#171719" fill-opacity=".4"/></svg>
      </span>
    </div>

    <div class="topbar">
      <span class="wordmark">PICTRIP<span class="wordmark-dot"></span></span>
    </div>

    <div class="scroll">
      <!-- 서클: Around는 위치 아이콘, Festa·Pets는 '본 상태'(회색 링) 예시 -->
      <div class="circles">
        <div class="circle">
          <div class="ring unseen"><div class="thumb around">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="8" stroke-opacity=".45"/></svg>
          </div></div>
          <span class="circle-label">Around</span>
        </div>
        <div class="circle">
          <div class="ring unseen"><div class="thumb" style="background-image:url('https://loremflickr.com/160/160/korea,temple?lock=21')"></div></div>
          <span class="circle-label">Hot</span>
        </div>
        <div class="circle">
          <div class="ring unseen"><div class="thumb" style="background-image:url('https://loremflickr.com/160/160/forest,path?lock=22')"></div></div>
          <span class="circle-label">Hidden</span>
        </div>
        <div class="circle seen-label">
          <div class="ring seen"><div class="thumb" style="background-image:url('https://loremflickr.com/160/160/lantern,festival?lock=23')"></div></div>
          <span class="circle-label">Festa</span>
        </div>
        <div class="circle seen-label">
          <div class="ring seen"><div class="thumb" style="background-image:url('https://loremflickr.com/160/160/dog,park?lock=24')"></div></div>
          <span class="circle-label">Pets</span>
        </div>
        <div class="circle">
          <div class="ring unseen"><div class="thumb" style="background-image:url('https://loremflickr.com/160/160/cherry,blossom?lock=25')"></div></div>
          <span class="circle-label">Snap</span>
        </div>
      </div>

      <!-- 게시물 1: 해외 훅 (1장째, 카드 인셋) -->
      <div class="c-wrap">
        <div class="card" style="background-image:url('https://loremflickr.com/804/1042/santorini?lock=11')">
          <div class="counter">1/4</div>
          <div class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></div>
          <div class="meta">
            <div class="title-row">
              <span class="name">산토리니</span>
              <span class="region-chip">그리스</span>
            </div>
            <div class="copy">에게해 절벽 위 하얀 마을, 그 유명한 파란 지붕.<br/>밀면 <b>이 감성 그대로인 국내 여행지</b>가 나와요.</div>
          </div>
        </div>
      </div>
      <div class="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>

      <!-- 게시물 2: 다음 카드 살짝 노출 = 무한 스크롤 암시 -->
      <div class="peek" style="background-image:url('https://loremflickr.com/804/1004/arashiyama,bamboo?lock=12')"></div>
    </div>

    <div class="tabbar">
      <div class="tab on">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
        홈
      </div>
      <div class="tab">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        탐색
      </div>
      <div class="tab">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
        지도
      </div>
      <div class="tab">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.6-3.5 4.3-5 7.5-5s5.9 1.5 7.5 5"/></svg>
        마이
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>
  <span class="cap">홈 — 서클 6채널(본/안 본 상태) + 해외 훅 게시물</span>
</div>

</body>
</html>
